name: 🚀 Deploy website on push

on:
  push:
    branches:
      - Zainab-Almasoodi-patch-2 # Change this to your branch name

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: Use Node.js 16
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      
      - name: 🔨 Build Project
        run: |
          npm install
          npm run build
    
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.05-tech.com
          username: zainab@05-tech.com
          password: ${{ secrets.FTP_PASSWORD }} # Use secrets for security
          protocol: ${{ secrets.GIT_CPANEL_REACT_PROTOCOL }} # Set in secrets
          local-dir: ./dist/ # Change to your actual build output directory
